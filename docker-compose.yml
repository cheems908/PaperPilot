# docker-compose.yml — PaperPilot 基础设施
#
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v
#
# 第一阶段（MVP）只依赖以下服务；ChromaDB 已注释，后续阶段再启用:
#   docker compose up -d mysql redis rocketmq-namesrv rocketmq-broker grobid
#
# 密钥通过 .env 注入（见 .env.example），不入库。

services:
  mysql:
    image: mysql:8.0
    container_name: paperpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (copy .env.example to .env)}
      MYSQL_DATABASE: paperpilot
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paperpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RocketMQ NameServer — 注册中心
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: paperpilot-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ Broker — 消息中转 (依赖 NameServer)
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: paperpilot-rmq-broker
    restart: unless-stopped
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.0/conf/broker-local.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - ./docker/rocketmq/broker-local.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker-local.conf:ro
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy

  # GROBID — PDF 结构化解析
  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: paperpilot-grobid
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      # 规避容器内 JVM cgroup 检测 NPE（CgroupInfo.getMountPoint）
      JAVA_OPTS: "-XX:-UseContainerSupport"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8070"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ChromaDB — 向量数据库（暂不启用，后续阶段恢复）
  # chromadb:
  #   image: chromadb/chroma:latest
