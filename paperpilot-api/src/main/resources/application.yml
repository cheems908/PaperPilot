server:
  port: 8080

spring:
  application:
    name: paperpilot-api

  # 默认激活 local profile，读取本机 application-local.yml（gitignored）
  # 生产/CI 可用 SPRING_PROFILES_ACTIVE 覆盖
  profiles:
    default: local

  # MySQL（密钥来自环境变量 / application-local.yml，不入库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Flyway 数据库迁移
  flyway:
    enabled: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 枚举按 name() 存库（如 PENDING / PARSE_PAPER）
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: auto

# RocketMQ
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: paperpilot-producer-group
  consumer:
    group: paperpilot-consumer-group

# Python Worker
paperpilot:
  worker:
    base-url: ${AGENT_WORKER_URL:http://localhost:8001}
    connect-timeout: ${WORKER_CONNECT_TIMEOUT:3s}
    read-timeout: ${WORKER_READ_TIMEOUT:60s}
    # 读取超时按阶段覆盖（未配置的阶段用默认 read-timeout）
    stage-read-timeouts:
      PARSE_PAPER: ${WORKER_READ_TIMEOUT_PARSE:120s}
      CLONE_REPOSITORY: ${WORKER_READ_TIMEOUT_CLONE:300s}
      INDEX_CODE: ${WORKER_READ_TIMEOUT_INDEX:120s}
      MAP_CONCEPTS: ${WORKER_READ_TIMEOUT_MAP:60s}
  # 本地文件存储（MVP 无 MinIO）
  storage:
    local-dir: ${PAPERPILOT_STORAGE_DIR:./uploads}
  # MQ：阶段任务消息 topic 与消费者组（环境变量可覆盖，见 T2-01 契约）
  mq:
    task-topic: ${TASK_MQ_TOPIC:paperpilot-analysis-stage}
    consumer-group: ${TASK_MQ_CONSUMER_GROUP:paperpilot-stage-orchestrator}
  # 进度缓存（T4-01）：Redis 短期快照，MySQL 才是正式状态真相来源
  progress:
    key-prefix: ${TASK_PROGRESS_KEY_PREFIX:paperpilot:task}
    ttl: ${TASK_PROGRESS_TTL:24h}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
