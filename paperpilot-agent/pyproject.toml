[project]
name = "paperpilot-agent"
version = "0.1.0"
description = "PaperPilot Agent Worker - LangGraph-based multi-agent system for paper reproduction"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jsonschema>=4.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
