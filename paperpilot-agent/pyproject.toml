[project]
name = "paperpilot-agent"
version = "0.1.0"
description = "PaperPilot Agent Worker - LangGraph-based multi-agent system for paper reproduction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.14",
    "starlette==0.46.2",
    "anyio==4.8.0",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.1",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "pymupdf>=1.24.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "jsonschema==4.26.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]
